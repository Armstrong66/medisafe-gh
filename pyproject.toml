[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medisafe-gh"
version = "0.1.0"
description = "G-MASS: Ghana Medical AI Safety Screen -- cross-lingual safety evaluation for medical AI in Ghanaian languages"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["ai-safety", "medical-ai", "ghana", "twi", "llm-evaluation", "g-mass", "africa-ai"]
authors = [{ name = "MediSafe-GH Team" }]
dependencies = [
  "openai>=1.30.0",
  "google-genai>=1.0.0",
  "huggingface_hub>=0.23.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "numpy>=1.22.4,<2.0",
  "fasttext-wheel>=0.9.2",
  "openpyxl>=3.1.0",
  "pandas==2.2.3",
  "datasets==2.20.0",
  "jsonlines==4.0.0",
  "transformers>=4.45.0,<5.0",
  "torch==2.3.1",
  "accelerate==0.31.0",
  "scikit-learn==1.5.1",
  "tqdm==4.66.4",
  "rich==13.7.1",
  "jinja2==3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "black>=24.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/[username]/medisafe-gh"
"HuggingFace Dataset" = "https://huggingface.co/datasets/[username]/gmass-probe-set"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "probes*", "scorer*", "translation*"]
exclude = ["tests*", "venv*"]

[tool.ruff]
line-length = 100
