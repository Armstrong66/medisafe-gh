name: G-MASS Safety Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_key:
        description: "Model key to evaluate"
        required: true
        default: "gemini"

jobs:
  safety-gate:
    name: G-MASS Canary Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Pre-flight Configuration Validation
        run: |
          python -c "from core.config import validate_setup_and_configs; res = validate_setup_and_configs(); print('Validation:', res['status']); assert len(res['errors']) == 0, res['errors']"

      - name: Run Test Suite
        run: pytest tests/ -v
